<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Collection | Jewel Corner Oman</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="products-page">
<header>
  <div class="container nav-container">
    <div class="logo"><a href="index.html"><img src="logo.png" alt="Jewel Corner Logo"></a></div>
    <nav class="nav">
      <a href="index.html" data-i18n="nav_home">HOME</a>
      <a href="index.html#collections" data-i18n="nav_collections">COLLECTIONS</a>
      <a href="index.html#contact" data-i18n="nav_contact">CONTACT</a>
    </nav>
    <div class="language-switch">
      <button type="button" data-lang="en" onclick="setLanguage('en')">EN</button>
      <button type="button" data-lang="ar" onclick="setLanguage('ar')">AR</button>
    </div>
    <div class="menu-toggle">&#9776;</div>
  </div>
</header>

<main>
  <section class="products-hero">
    <div class="container">
      <h1 id="categoryTitle" data-i18n="products_title">OUR COLLECTION</h1>
      <p data-i18n="products_intro">Explore Jewel Corner products and enquire directly on WhatsApp.</p>
    </div>
  </section>

  <div class="breadcrumb-wrap" id="breadcrumb"></div>

  <div class="products-toolbar">
    <div class="search-box">
      <input id="productSearch" type="search" placeholder="Search products..." autocomplete="off">
    </div>
    <div class="product-count" id="productCount"></div>
  </div>

  <section style="padding-top:0;">
    <div class="products-layout">
      <aside class="category-sidebar" id="categorySidebar"></aside>
      <div id="productsContainer" class="catalog-grid"></div>
    </div>
  </section>
</main>

<footer>
  <div class="footer-social">
    <a href="https://wa.me/96877147645" target="_blank"><i class="fab fa-whatsapp"></i></a>
    <a href="https://instagram.com/jewelcorneroman" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://www.snapchat.com/add/jewelcorneroman" target="_blank"><i class="fab fa-snapchat"></i></a>
  </div>
  <p>© 2018 Jewel Corner Oman | All Rights Reserved</p>
</footer>

<div class="product-modal" id="productModal" aria-hidden="true">
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <img class="modal-image" id="modalImage" alt="">
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <div class="modal-meta" id="modalCode"></div>
      <div class="modal-meta" id="modalBrand"></div>
      <p class="modal-description" id="modalDescription"></p>
      <div id="modalPrice"></div>
      <div style="margin-top:18px;" id="modalActions"></div>

      <!-- CUSTOMER RATING & FAVOURITES -->
<div id="customerProductActions" class="customer-product-actions">

  <div id="productRatingSummary" class="product-rating-summary">
    <span id="productAverageStars">☆☆☆☆☆</span>
    <span id="productRatingText">No ratings yet</span>
  </div>

  <button
    type="button"
    id="favouriteProductBtn"
    class="favourite-product-btn"
  >
    ♡ Add to Favourites
  </button>
  
<button
  type="button"
  id="rateProductBtn"
  class="rate-product-btn"
>
  ★ Rate & Review this Product
</button>

<!-- CUSTOMER REVIEW FORM -->
<div
  id="customerReviewForm"
  class="customer-review-form"
  hidden
>

  <h3>Rate & Review</h3>

  <div
    id="reviewStarPicker"
    class="review-star-picker"
    aria-label="Choose a rating"
  >
    <button type="button" data-rating="1">☆</button>
    <button type="button" data-rating="2">☆</button>
    <button type="button" data-rating="3">☆</button>
    <button type="button" data-rating="4">☆</button>
    <button type="button" data-rating="5">☆</button>
  </div>

  <input
    type="text"
    id="reviewDisplayName"
    maxlength="50"
    placeholder="Your name"
    autocomplete="name"
  >

  <textarea
    id="reviewComment"
    maxlength="1000"
    rows="4"
    placeholder="Write a comment (optional)"
  ></textarea>

  <button
    type="button"
    id="submitReviewBtn"
    class="submit-review-btn"
  >
    Submit Review
  </button>

  <button
  type="button"
  id="deleteReviewBtn"
  class="delete-review-btn"
  hidden
>
  Delete Review
</button>
  
  <div
    id="reviewFormMessage"
    class="review-form-message"
    aria-live="polite"
  ></div>

</div>

</div>
    </div>
  </div>
</div>

<script src="script.js"></script>

<script
    type="module"
    src="firebase-products.js">
</script>

<script src="products.js"></script>
</body>
</html>
