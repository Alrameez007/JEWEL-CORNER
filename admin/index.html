<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jewel Corner Admin</title>

    <meta name="theme-color" content="#d4af37">

    <link rel="stylesheet" href="admin.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <!-- =========================
         LOGIN SCREEN
    ========================== -->

    <main class="admin-login-page" id="loginPage">

        <div class="login-card">

            <div class="admin-login-logo">
                <img
                    src="images/jewel-corner-logo.png"
                    alt="Jewel Corner"
                >
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-button"
                    id="loginButton"
                >
                    Login
                </button>

                <p
                    class="login-message"
                    id="loginMessage"
                ></p>

            </form>

        </div>

    </main>


    <!-- =========================
         ADMIN DASHBOARD
    ========================== -->

    <main
        class="admin-dashboard hidden"
        id="dashboardPage"
    >

        <header class="admin-header">

            <div>
                <h1>JEWEL CORNER</h1>
                <span>Admin</span>
            </div>

            <button
                type="button"
                class="logout-button"
                id="logoutButton"
            >
                Logout
            </button>

        </header>


        <section class="dashboard-content">

            <div class="welcome-area">

                <h2>Product Management</h2>

                <p>
                    Add and manage Jewel Corner products.
                </p>

            </div>


            <div class="dashboard-actions">

                <button
                    type="button"
                    class="dashboard-card"
                    id="addProductButton"
                >
                    <span class="dashboard-icon">
                        +
                    </span>

                    <strong>
                        Add Product
                    </strong>

                    <small>
                        Create a new catalogue item
                    </small>
                </button>


                <button
                    type="button"
                    class="dashboard-card"
                    id="manageProductsButton"
                >
                    <span class="dashboard-icon">
                        ☰
                    </span>

                    <strong>
                        Manage Products
                    </strong>

                    <small>
                        View, edit or disable products
                    </small>
                </button>

            </div>

        </section>
        <!-- =========================
     ADD PRODUCT FORM
========================== -->

<section
    class="product-form-section hidden"
    id="productFormSection"
>

    <div class="form-section-header">

        <div>
            <h2>Add Product</h2>
            <p>Create a new Jewel Corner catalogue item.</p>
        </div>

        <button
            type="button"
            class="secondary-button"
            id="backToDashboardButton"
        >
            Back
        </button>

    </div>


    <form id="productForm">

        <div class="form-grid">


            <!-- PRODUCT ID -->

            <div class="form-group">
                <label for="productId">
                    Product ID
                </label>

                <input
                    type="text"
                    id="productId"
                    required
                    placeholder="Example: BRC-0041"
                >
            </div>


            <!-- SKU -->

            <div class="form-group">
                <label for="productSku">
                    SKU
                </label>

                <input
                    type="text"
                    id="productSku"
                    placeholder="Example: BRC-0041"
                >
            </div>


            <!-- NAME EN -->

            <div class="form-group">
                <label for="productNameEn">
                    Product Name EN
                </label>

                <input
                    type="text"
                    id="productNameEn"
                    required
                >
            </div>


            <!-- NAME AR -->

            <div class="form-group">
                <label for="productNameAr">
                    Product Name AR
                </label>

                <input
                    type="text"
                    id="productNameAr"
                    dir="rtl"
                >
            </div>


            <!-- CATEGORY -->

            <div class="form-group">
                <label for="productCategory">
                    Category
                </label>

                <select
                    id="productCategory"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    <option value="jewellery">
                        Jewellery
                    </option>

                    <option value="watches">
                        Watches
                    </option>

                    <option value="perfumes">
                        Perfumes
                    </option>

                    <option value="souvenirs">
                        Souvenirs
                    </option>

                </select>
            </div>


            <!-- SUBCATEGORY -->

            <div class="form-group">
                <label for="productSubcategory">
                    Subcategory
                </label>

                <input
                    type="text"
                    id="productSubcategory"
                    required
                    placeholder="Example: bracelets"
                >
            </div>


            <!-- BRAND -->

            <div class="form-group">
                <label for="productBrand">
                    Brand
                </label>

                <input
                    type="text"
                    id="productBrand"
                >
            </div>


            <!-- PRICE -->

            <div class="form-group">
                <label for="productPrice">
                    Price OMR
                </label>

                <input
                    type="number"
                    id="productPrice"
                    min="0"
                    step="0.001"
                    placeholder="0.000"
                >
            </div>


         <!-- MAIN IMAGE -->

<div class="form-group full-width">

    <label for="productImageFile">
        Main Product Image
    </label>

    <input
        type="file"
        id="productImageFile"
        accept="image/*"
    >

    
<div class="form-group">
  <label for="additionalImages">Additional Product Images</label>

  <input
    type="file"
    id="additionalImages"
    accept="image/*"
    multiple
  >
</div>
    
<div id="additionalImagesPreview" class="additional-images-preview"></div>

    <!-- IMAGE PREVIEW -->
    <div
        id="productImagePreviewBox"
        class="image-preview-box hidden"
    >
        <img
            id="productImagePreview"
            alt="Product Image Preview"
        >
    </div>

    <!-- UPLOAD STATUS -->
    <p
        id="imageUploadMessage"
        class="image-upload-message"
    ></p>

    <!-- IMAGEKIT URL SAVED HERE -->
    <input
        type="hidden"
        id="productMainImage"
    >

</div>


            <!-- DESCRIPTION EN -->

            <div class="form-group full-width">
                <label for="productDescriptionEn">
                    Description EN
                </label>

                <textarea
                    id="productDescriptionEn"
                    rows="4"
                ></textarea>
            </div>


            <!-- DESCRIPTION AR -->

            <div class="form-group full-width">
                <label for="productDescriptionAr">
                    Description AR
                </label>

                <textarea
                    id="productDescriptionAr"
                    rows="4"
                    dir="rtl"
                ></textarea>
            </div>


            <!-- TAGS -->

            <div class="form-group full-width">
                <label for="productTags">
                    Tags
                </label>

                <input
                    type="text"
                    id="productTags"
                    placeholder="bracelet, gold plated, ladies"
                >
            </div>

        </div>


        <!-- TOGGLES -->

        <div class="toggle-grid">

            <label class="toggle-option">

                <input
                    type="checkbox"
                    id="showPrice"
                >

                <span>
                    Show Price
                </span>

            </label>


            <label class="toggle-option">

                <input
                    type="checkbox"
                    id="featured"
                >

                <span>
                    Featured
                </span>

            </label>


            <label class="toggle-option">

                <input
                    type="checkbox"
                    id="newArrival"
                >

                <span>
                    New Arrival
                </span>

            </label>


            <label class="toggle-option">

                <input
                    type="checkbox"
                    id="whatsappEnquiry"
                    checked
                >

                <span>
                    WhatsApp Enquiry
                </span>

            </label>

        </div>


        <!-- STATUS -->

        <div class="form-group">

            <label for="productStatus">
                Status
            </label>

            <select id="productStatus">

                <option value="active">
                    Active
                </option>

                <option value="inactive">
                    Inactive
                </option>

            </select>

        </div>


        <!-- SAVE -->

        <button
            type="submit"
            class="primary-button"
            id="saveProductButton"
        >
            Save Product
        </button>


        <p
            class="product-form-message"
            id="productFormMessage"
        ></p>

    </form>

</section>

    </main>


    <script type="module" src="admin.js"></script>

</body>
</html>
